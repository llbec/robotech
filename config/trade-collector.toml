config_version = 1

[server]
host = "0.0.0.0"
port = 8082
shutdown_timeout_seconds = 10

[logging]
level = "info"
format = "json"

[hyperliquid]
network = "mainnet"
connect_timeout_seconds = 5
request_timeout_seconds = 10
max_response_bytes = 16777216

[evidence]
directory = "/var/lib/robotech/trade-log"

[internal]
credential_file = "/run/secrets/trade-log-token"

[database]
url_file = "/run/secrets/trade-log-collector-database-url"
max_connections = 8
connect_timeout_seconds = 5
statement_timeout_seconds = 10

[collection]
# Optional one-time legacy import. Leave both empty for API-managed startup.
account = ""
start_time = ""
interval_seconds = 30
overlap_seconds = 60
safety_delay_seconds = 2
max_window_seconds = 3600
max_requests_per_round = 20
round_timeout_seconds = 120
lease_seconds = 180
retry_base_seconds = 5
retry_max_seconds = 300

# Disable this section to keep the v0.3 HTTP-only behavior.
[websocket]
enabled = true
connect_timeout_seconds = 10
subscribe_timeout_seconds = 10
ping_interval_seconds = 20
pong_timeout_seconds = 10
reconnect_base_seconds = 5
reconnect_max_seconds = 60
reconnect_jitter_percent = 20
reconnect_reset_after_seconds = 60
max_message_bytes = 16777216
max_pending_messages = 256
max_pending_bytes = 33554432
metadata_refresh_seconds = 300
commit_timeout_seconds = 10

[monitoring]
max_active_accounts = 5
max_registered_accounts = 100
reconcile_interval_seconds = 2
worker_stale_after_seconds = 30
max_concurrent_http_requests = 2
max_total_pending_bytes = 67108864

[source_budget]
http_weight_per_minute = 600
websocket_connections_per_minute = 15
