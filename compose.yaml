services:
  trade-log-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the external PostgreSQL DATABASE_URL in .env}
      EVENT_WEBHOOK_URL: ${EVENT_WEBHOOK_URL:?set EVENT_WEBHOOK_URL in .env}
      EVENT_WEBHOOK_SECRET: ${EVENT_WEBHOOK_SECRET:?set EVENT_WEBHOOK_SECRET in .env}
      HTTP_LISTEN_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      DEFAULT_HISTORY_LOOKBACK_SECONDS: ${DEFAULT_HISTORY_LOOKBACK_SECONDS:-604800}
      HTTP_OVERLAP_SECONDS: ${HTTP_OVERLAP_SECONDS:-120}
      HTTP_RECONCILE_INTERVAL_SECONDS: ${HTTP_RECONCILE_INTERVAL_SECONDS:-30}
      MAX_MONITORED_ADDRESSES: ${MAX_MONITORED_ADDRESSES:-10}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    # Linux Docker does not create host.docker.internal automatically.
    # This lets DATABASE_URL reach an independently deployed PostgreSQL
    # through its host-published port (for example port 5432).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
