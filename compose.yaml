# 容器服务清单；在项目根目录执行 docker compose up --build -d 启动常驻服务。
services:
  # 外部 HTTP 网关；只有此业务服务映射宿主机端口。
  query-api:
    # 镜像名称/版本；应用发布时同步更新版本，数据库镜像固定摘要以保证可重复部署。
    image: robotech/query-api:0.6.0
    # 本地构建配置；up --build 或初始化脚本按此构建。
    build:
      # 构建上下文为项目根目录，保持 .。
      context: .
      # 相对于构建上下文的 Dockerfile 路径。
      dockerfile: gateway/query-api/Dockerfile
      # Dockerfile 构建阶段名称，须对应本服务的可执行程序。
      target: query-api
    # 宿主机端口:容器端口；左侧可改对外端口，右侧须匹配 TOML 监听端口。
    ports:
      - "8080:8080"
    # 挂载配置、凭证或持久化数据；bind 的宿主机文件需预先存在。
    volumes:
      # bind 表示挂载宿主机文件；下方 source/target 分别是宿主机和容器路径。
      - type: bind
        # 宿主机文件路径，相对于项目目录；凭证由初始化脚本生成。
        source: ./config/query-api.toml
        # 容器内文件路径；文件挂载须匹配 TOML 或启动命令引用的路径。
        target: /etc/robotech/query-api.toml
        # true 禁止容器修改此挂载/自身根文件系统；命名数据卷仍可写入。
        read_only: true
        # 宿主机文件挂载策略。
        bind:
          # false：文件缺失时直接报错，避免把缺失文件自动创建为目录。
          create_host_path: false
      # bind 表示挂载宿主机文件；下方 source/target 分别是宿主机和容器路径。
      - type: bind
        # 宿主机文件路径，相对于项目目录；凭证由初始化脚本生成。
        source: ./secrets/trade-log-token
        # 容器内文件路径；文件挂载须匹配 TOML 或启动命令引用的路径。
        target: /run/secrets/trade-log-token
        # true 禁止容器修改此挂载/自身根文件系统；命名数据卷仍可写入。
        read_only: true
        # 宿主机文件挂载策略。
        bind:
          # false：文件缺失时直接报错，避免把缺失文件自动创建为目录。
          create_host_path: false
      # bind 表示挂载宿主机文件；下方 source/target 分别是宿主机和容器路径。
      - type: bind
        # 宿主机文件路径，相对于项目目录；凭证由初始化脚本生成。
        source: ./secrets/watch-management-token
        # 容器内文件路径；文件挂载须匹配 TOML 或启动命令引用的路径。
        target: /run/secrets/watch-management-token
        # true 禁止容器修改此挂载/自身根文件系统；命名数据卷仍可写入。
        read_only: true
        # 宿主机文件挂载策略。
        bind:
          # false：文件缺失时直接报错，避免把缺失文件自动创建为目录。
          create_host_path: false
    # true 禁止容器修改此挂载/自身根文件系统；命名数据卷仍可写入。
    read_only: true
    # Docker 停止容器的等待时长；应用服务应大于 TOML 的退出超时，之后会强制终止。
    stop_grace_period: 15s
    # no 表示不自动重启，便于测试定位退出原因；需要自动恢复时可改 unless-stopped。
    restart: "no"

  # 成交 live/stored 查询服务，仅供 Compose 网络内访问。
  trade-log-query:
    # 镜像名称/版本；应用发布时同步更新版本，数据库镜像固定摘要以保证可重复部署。
    image: robotech/trade-log-query:0.6.0
    # 本地构建配置；up --build 或初始化脚本按此构建。
    build:
      # 构建上下文为项目根目录，保持 .。
      context: .
      # 相对于构建上下文的 Dockerfile 路径。
      dockerfile: gateway/query-api/Dockerfile
      # Dockerfile 构建阶段名称，须对应本服务的可执行程序。
      target: trade-log-query
    # 挂载配置、凭证或持久化数据；bind 的宿主机文件需预先存在。
    volumes:
      # bind 表示挂载宿主机文件；下方 source/target 分别是宿主机和容器路径。
      - type: bind
        # 宿主机文件路径，相对于项目目录；凭证由初始化脚本生成。
        source: ./config/trade-log.toml
        # 容器内文件路径；文件挂载须匹配 TOML 或启动命令引用的路径。
        target: /etc/robotech/trade-log.toml
        # true 禁止容器修改此挂载/自身根文件系统；命名数据卷仍可写入。
        read_only: true
        # 宿主机文件挂载策略。
        bind:
          # false：文件缺失时直接报错，避免把缺失文件自动创建为目录。
          create_host_path: false
      # bind 表示挂载宿主机文件；下方 source/target 分别是宿主机和容器路径。
      - type: bind
        # 宿主机文件路径，相对于项目目录；凭证由初始化脚本生成。
        source: ./secrets/trade-log-token
        # 容器内文件路径；文件挂载须匹配 TOML 或启动命令引用的路径。
        target: /run/secrets/trade-log-token
        # true 禁止容器修改此挂载/自身根文件系统；命名数据卷仍可写入。
        read_only: true
        # 宿主机文件挂载策略。
        bind:
          # false：文件缺失时直接报错，避免把缺失文件自动创建为目录。
          create_host_path: false
      # bind 表示挂载宿主机文件；下方 source/target 分别是宿主机和容器路径。
      - type: bind
        # 宿主机文件路径，相对于项目目录；凭证由初始化脚本生成。
        source: ./secrets/trade-log-database-url
        # 容器内文件路径；文件挂载须匹配 TOML 或启动命令引用的路径。
        target: /run/secrets/trade-log-database-url
        # true 禁止容器修改此挂载/自身根文件系统；命名数据卷仍可写入。
        read_only: true
        # 宿主机文件挂载策略。
        bind:
          # false：文件缺失时直接报错，避免把缺失文件自动创建为目录。
          create_host_path: false
      # 证据持久卷挂载到 TOML evidence.directory，供多个服务共享。
      - trade-log-evidence:/var/lib/robotech/trade-log
    # true 禁止容器修改此挂载/自身根文件系统；命名数据卷仍可写入。
    read_only: true
    # Docker 停止容器的等待时长；应用服务应大于 TOML 的退出超时，之后会强制终止。
    stop_grace_period: 15s
    # no 表示不自动重启，便于测试定位退出原因；需要自动恢复时可改 unless-stopped。
    restart: "no"

  # 多账户 HTTP/WS 采集服务，账户清单通过管理接口维护。
  trade-collector:
    # 镜像名称/版本；应用发布时同步更新版本，数据库镜像固定摘要以保证可重复部署。
    image: robotech/trade-collector:0.6.0
    # 本地构建配置；up --build 或初始化脚本按此构建。
